x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    VITE_APP_NAME: ${VITE_APP_NAME:-Authxolote}
    VITE_APP_URL: ${VITE_APP_URL:-http://localhost:8081}
    VITE_AUTH_URL: ${VITE_AUTH_URL:-http://localhost:8081}
    VITE_MENU_SLUG: ${VITE_MENU_SLUG:-auth}

x-environment: &environment
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-http://localhost:8081}
  APP_LOCALE: ${APP_LOCALE:-es}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-error}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-host.docker.internal}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-auth}
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:-root}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

services:
  app:
    build: *build
    image: authxolote
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    environment: *environment
    extra_hosts: *extra-hosts
    volumes:
      - storage:/app/storage

  worker:
    build: *build
    image: authxolote
    restart: unless-stopped
    entrypoint: ["php", "artisan"]
    command: ["queue:work", "--tries=1", "--max-time=3600", "--sleep=3"]
    environment: *environment
    extra_hosts: *extra-hosts
    volumes:
      - storage:/app/storage
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  # scheduler:
  #   build: *build
  #   image: authxolote
  #   restart: unless-stopped
  #   entrypoint: ["php", "artisan"]
  #   command: ["schedule:work"]
