x-build: &build
  context: .
  dockerfile: Dockerfile

x-environment: &environment
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-http://localhost:8081}
  APP_LOCALE: ${APP_LOCALE:-es}
  LOG_CHANNEL: ${LOG_CHANNEL:-stack}
  LOG_LEVEL: ${LOG_LEVEL:-error}
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-host.docker.internal}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-auth}
  DB_USERNAME: ${DB_USERNAME:-root}
  DB_PASSWORD: ${DB_PASSWORD:-root}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  CACHE_STORE: ${CACHE_STORE:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  APP_NAME: ${APP_NAME:-App}
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  ROOT_USER_NAME: ${ROOT_USER_NAME:-}
  ROOT_USER_EMAIL: ${ROOT_USER_EMAIL:-}
  ROOT_USER_PASSWORD: ${ROOT_USER_PASSWORD:-}
  PASSPORT_PRIVATE_KEY: ${PASSPORT_PRIVATE_KEY:-}
  PASSPORT_PUBLIC_KEY: ${PASSPORT_PUBLIC_KEY:-}
  RUN_SEED: ${RUN_SEED:-false}
  SYNC_AUTHXOLOTE: ${SYNC_AUTHXOLOTE:-true}
  SCRIBE_GENERATE: ${SCRIBE_GENERATE:-false}

x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

services:
  app:
    build: *build
    image: authxolote
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    environment: *environment
    extra_hosts: *extra-hosts
    networks:
      - default
      - coolify
    volumes:
      - storage:/app/storage

  worker:
    image: authxolote
    restart: unless-stopped
    entrypoint: ["php", "artisan"]
    command: ["queue:work", "--tries=1", "--max-time=3600", "--sleep=3"]
    environment: *environment
    extra_hosts: *extra-hosts
    networks:
      - default
      - coolify
    volumes:
      - storage:/app/storage
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  # scheduler:
  #   build: *build
  #   image: authxolote
  #   restart: unless-stopped
  #   entrypoint: ["php", "artisan"]
  #   command: ["schedule:work"]
  #   environment: *environment
  #   extra_hosts: *extra-hosts
  #   networks:
  #     - default
  #     - coolify
  #   volumes:
  #     - storage:/app/storage
  #   healthcheck:
  #     disable: true
  #   depends_on:
  #     app:
  #       condition: service_healthy

networks:
  coolify:
    external: true

volumes:
  storage:
